[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "qqbot-private"
version = "0.1.0"
description = "Private QQ assistant with configurable Chat Completions models"
requires-python = ">=3.12"
dependencies = ["aiohttp==3.14.1"]

[tool.setuptools.packages.find]
include = ["qqbot*"]
