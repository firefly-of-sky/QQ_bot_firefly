[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "qqbot-private"
version = "3.0.0"
description = "Tulpa MCP powered resident QQ agent with isolated friend sessions"
requires-python = ">=3.12"
dependencies = [
    "aiohttp==3.14.1", "markdown-it-py==4.0.0", "mcp==1.26.0",
    "httpx==0.28.1", "jieba==0.42.1", "python-dotenv==1.2.3",
    "websockets==15.0.1", "jsonschema==4.26.0", "Pillow==12.1.1",
    "fastapi==0.135.1", "uvicorn==0.41.0",
]

[tool.setuptools.packages.find]
include = ["qqbot*"]

[tool.setuptools.package-data]
"qqbot.prompts" = ["*.md"]
