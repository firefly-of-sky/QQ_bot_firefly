[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "qqbot-private"
version = "2.0.1"
description = "Tool-using conversational QQ agent with isolated friend sessions"
requires-python = ">=3.12"
dependencies = ["aiohttp==3.14.1", "markdown-it-py==4.0.0"]

[tool.setuptools.packages.find]
include = ["qqbot*"]

[tool.setuptools.package-data]
"qqbot.prompts" = ["*.md"]
