[conversations]
# Continue accepting existing QQ friends; groups/temporary chats stay disabled.
friends = "all" # or "owner"
max_sessions = 8
idle_seconds = 300

# Experimental, independently testable; defaults preserve the current runtime.
[performance]
compact_context = false
single_bubble_short_replies = false # join plain text queues <=300 chars; keep all text

# Owner-authorized account operator. Enable only after choosing a consent ID
# and generating the installed channel's action manifest (scripts/cloud/capabilities.py).
[autonomy]
enabled = false
authorization_id = ""
capabilities_file = "" # e.g. /data/tulpa/provider-actions.json
background_friend_requests = false
writes_per_minute = 10
background_per_hour = 12

# Optional additional MCP tools, discovered on connection; no Python changes.
# Add only servers you trust. Tools execute with that server's own permissions.
# [mcp_servers.knowledge]
# url = "https://your-server.example/mcp"
# token_env = "KNOWLEDGE_MCP_TOKEN"
# tools = ["search", "lookup"] # omit to expose every tool from this server
